name: build-artifact

# Build and push the multi-arch image of a commit of main once its CI passed.
# Delegates the actual work to `make docker-buildx`, which builds for
# $(PLATFORMS) and pushes to $(REGISTRY)/exec/kubocd.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Allow manual runs from the Actions tab / `gh workflow run`, for a commit
  # whose CI passed.
  workflow_dispatch:

# Required repo configuration (Settings > Secrets and variables > Actions):
#   - Variable REGISTRY            e.g. quay.io/kubocd   (becomes $(REGISTRY))
#   - Secrets  REGISTRY_USERNAME, REGISTRY_PASSWORD      (push to that registry)
#   - Optional Variable DOCKERHUB_USERNAME + Secret DOCKERHUB_TOKEN (base-image pulls)
env:
  REGISTRY: ${{ vars.REGISTRY }}

permissions:
  contents: write
  actions: read

# A publication waits for the one in progress, never cancels it.
concurrency:
  group: build-artifact
  cancel-in-progress: false

jobs:
  build-artifact:
    # A branch named main in a fork also matches the branch filter of
    # workflow_run, hence the checks of the event and of the repository.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      # Under workflow_run, github.sha is the head of main, not the commit that
      # the CI tested.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0          # goreleaser needs tags + full history

      # A run started by hand publishes a commit whose CI passed on a push to
      # main, as the workflow_run trigger does.
      - name: Check that the CI passed on this commit
        if: github.event_name == 'workflow_dispatch'
        run: bash hack/ci-passed.sh "$GITHUB_SHA"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The tag is derived from APP_VERSION in the Makefile. A snapshot version
      # moves its tag to this commit, so that goreleaser releases it (it
      # releases the tagged commit). A final version never moves its tag: the
      # job stops here when the tag is on another commit.
      - name: Tag the commit
        id: tag
        run: |
          APP_VERSION=$(grep -m1 '^APP_VERSION' Makefile | awk '{print $3}')
          bash hack/release-tag.sh "$APP_VERSION" >> "$GITHUB_OUTPUT"

      # ubuntu-latest already ships make, go and docker; this only adds the
      # bits `make docker-buildx` needs for cross-platform builds.
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      # Cross-platform emulation for the linux/arm64 + linux/amd64 build.
      # `make docker-buildx` creates its own `kubocd-builder`, so no
      # setup-buildx-action step is needed here.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.16.0          # pinned (was `latest`) to avoid silent drift
          install-only: true       # install the binary, don't run it


      # Authenticate to Docker Hub so the BuildKit/QEMU base images
      # (moby/buildkit, etc.) pull reliably instead of hitting anonymous
      # rate limits / timeouts. Skipped automatically if the var is unset.
      - name: Log in to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Derive the registry host (e.g. quay.io) from REGISTRY for the login.
      - name: Resolve registry host
        id: reg
        run: echo "host=${REGISTRY%%/*}" >> "$GITHUB_OUTPUT"

      - name: Log in to the container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ steps.reg.outputs.host }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}


      # A snapshot reuses its tag across runs, so delete any previous release
      # first. `|| true` keeps the first run (no release yet) from failing. The
      # release of a final version stays: a run again on its commit uploads its
      # assets again (replace_existing_artifacts in .goreleaser.yaml).
      - name: Delete previous release
        if: steps.tag.outputs.snapshot == 'true'
        run: |
          APP_VERSION=$(grep -m1 '^APP_VERSION' Makefile | awk '{print $3}')
          gh release delete "$APP_VERSION" --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: make cli-release
        run: make cli-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: make charts
        run: make charts REGISTRY="${REGISTRY}"

      - name: make docker-buildx
        run: make docker-buildx REGISTRY="${REGISTRY}"


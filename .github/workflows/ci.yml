name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build · vet · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Tool versions in sync (.tool-versions ↔ go.mod)
        run: make verify-tool-versions

      - name: Generated code is up to date
        run: |
          make manifests generate
          git diff --exit-code || {
            echo "::error::Generated code is stale — run 'make manifests generate' and commit."
            exit 1
          }

      - name: Formatting (gofmt)
        run: |
          make fmt
          git diff --exit-code || {
            echo "::error::Unformatted code — run 'make fmt' and commit."
            exit 1
          }

      - name: go vet
        run: make vet

      # `make setup-envtest` installs setup-envtest under bin/ and the kube-apiserver,
      # etcd and kubectl assets under bin/k8s/<version>-<os>-<arch>. Only those paths
      # are cached, not the whole bin/, because `make build-kubocd` writes there too.
      # go.mod carries the k8s.io/api and controller-runtime versions that pick the assets.
      - name: Cache envtest binaries
        uses: actions/cache@v4
        with:
          path: |
            bin/k8s
            bin/setup-envtest
            bin/setup-envtest-*
          key: envtest-${{ runner.os }}-${{ hashFiles('go.mod') }}

      # `make test-only` skips the manifests/generate/fmt/vet prerequisites — they
      # already ran as dedicated gates above; re-running them here would waste time
      # and could re-dirty the tree after the `git diff` checks.
      - name: Tests (envtest)
        run: make test-only

      - name: Coverage summary
        if: always()
        run: |
          if [ -f cover.out ]; then
            {
              echo "### Coverage"
              echo '```'
              go tool cover -func=cover.out | tail -1
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build
        run: make build-kubocd

  lint:
    name: lint (changed code)
    # PRs only: lint just the diff (only-new-issues) so pre-existing findings do not
    # block, while all new code must be clean. Pushes to main are already covered by
    # the PR that introduced them. The existing-debt cleanup is tracked separately.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Use the go.mod-pinned golangci-lint, compiled with this repo's Go toolchain.
      # (The prebuilt action binary is built with an older Go and rejects a newer
      # target Go version.) Lint only the lines changed in this PR so the pre-existing
      # findings do not block; new code must be clean.
      - name: Lint changed code
        run: go tool golangci-lint run --new-from-rev="${{ github.event.pull_request.base.sha }}"


# Following will allow a renaming of all kubocd kubernetes resources
# Allow overriding base name of all resources
baseNameOverride:

# Image is same for controller and webhook
image:
  pullSecrets: []
  # -- Override the image repository. Default is .Chart.Annotations.kubotal_image_repository (See Chart.yaml)
  repository:
  # -- Overrides the image tag whose default is the chart appVersion.
  tag:
  pullPolicy: IfNotPresent

webhook:
  replicaCount: 2

  # Allow to change some logger configuration
  logger:
    mode: json
    level: info

  # Setup toleration and node selector to run inside control plane
  deployInControlPlane: true
  # NodeSelector for the pod to be installed (Ignored if deployInControlPlane: true)
  nodeSelector: {}
  # -- Tolerations for the pod to be installed (Ignored if deployInControlPlane: true)
  tolerations: []


  # This will be used to validate communication between the API server and this webhook server
  # By default, will use a self signed certificate issuer. But, you can provide your own ClusterIssuer
  certificateClusterIssuer:

  metrics:
    enabled: false
    # TLS and bearer authentication. Existing HTTP/anonymous scrapers must
    # migrate, or set secured: false for unauthenticated HTTP without a token.
    # The Service port stays named https in either mode.
    # --reuse-values keeps the old secured: false default. Set metrics.secured: true or use --reset-then-reuse-values.
    secured: true
    # The certificate Secret must contain ca.crt for server verification.
    # Empty uses the chart's self-signed issuer, otherwise name a ClusterIssuer.
    certificateClusterIssuer:
    serviceMonitor:
      enabled: false
      name:  # -- Defaults to {{ include "kubocd.webhook.baseName" . }}
      # Bind the token's SA to metrics-reader. Set both fields or neither.
      # A half-filled pair fails even when disabled. Empty leaves RBAC external.
      # Some installs grant get /metrics already (e.g. kube-prometheus-stack), needing no binding.
      # Requires enabled, secured metrics, independently of serviceMonitor.enabled.
      # This creates neither the SA nor Prometheus discovery/pod configuration.
      prometheusServiceAccount:
        name: ""
        namespace: ""
      # Default: read /var/run/secrets/kubernetes.io/serviceaccount/token inside
      # Prometheus. Its identity must match the SA above or an external grant.
      # For arbitraryFSAccessThroughSMs.deny: true, use Secret-backed Bearer auth.
      # The Secret must be in the release/ServiceMonitor namespace and readable
      # by Prometheus Operator. Set both name and key or neither, even if disabled.
      # Complete credentials are used only by an enabled, secured ServiceMonitor.
      # Example in release namespace kubocd (replace with yours):
      # kubectl -n kubocd create serviceaccount kubocd-metrics-scraper
      # Apply this Secret, then wait for the control plane to fill data.token:
      # apiVersion: v1
      # kind: Secret
      # metadata:
      #   name: kubocd-metrics-scraper-token
      #   namespace: kubocd
      #   annotations:
      #     kubernetes.io/service-account.name: kubocd-metrics-scraper
      # type: kubernetes.io/service-account-token
      # Set prometheusServiceAccount: {name: kubocd-metrics-scraper, namespace: kubocd}
      # and authorization.credentials: {name: kubocd-metrics-scraper-token, key: token}.
      # This token is long-lived. Arrange rotation and revocation.
      # Keep the metrics CA, the token Secret's ca.crt is not the server CA.
      authorization:
        credentials:
          name: ""
          key: ""

    # -- Will default to {{ include "kubocd.webhook.baseName" . }}-metrics
    serviceName:
    # -- Will default to {{ include "kubocd.webhook.baseName" . }}-metrics
    certificateName:
    # -- Will default to {{ include "kubocd.webhook.baseName" . }}-metrics
    secretName:
    # -- Will default to {{ include "kubocd.webhook.baseName" . }}-metrics
    certificateSelfSignedIssuerName:

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

  # Security Context for container
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - "ALL"

  # -- Security Context for the whole pod
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  # -- Annotations to be added to the pod
  podAnnotations: {}

  # -- Annotations to be added to all other resources
  commonAnnotations: {}

  # -- Hooks for specific configuration. Leave as is for standard usage
  extraEnv:
  additionalArgs: []
  disableProbes: false
  extraVolumes: []
  #   - name:
  #     mountPath:
  #     claimName:


  # Following will allow a renaming of kubocd metrics related kubernetes resources
  # Allow overriding base name of all webhook resources
  # -- Will default to {{ include "kubocd.baseName" . }}-webhook
  baseNameOverride:
  # -- Will default to {{ include "kubocd.webhook.baseName" . }}
  deploymentName:
  # -- Will default to {{ include "kubocd.webhook.baseName" . }}
  serviceAccountName:
  # -- Will default to {{ include "kubocd.webhook.baseName" . }}
  clusterRoleName:

  # Following will allow a renaming of kubocd webhook related kubernetes resources
  # Leave it empty to use default values will works in most cases
  # -- Will default to {{ include "kubocd.webhook.baseName" . }}-webhook
  serviceName:
  # -- Will default to {{ include "kubocd.webhook.baseName" . }}-webhook
  certificateName:
  # -- Will default to {{ include "kubocd.webhook.baseName" . }}-webhook
  secretName:
  # -- Will default to {{ include "kubocd.webhook.baseName" . }}-webhook
  certificateSelfSignedIssuerName:
  # -- Will default to {{ include "kubocd.webhook.baseName" . }}-validating-webhook-configuration
  validatingWebhookConfiguration:

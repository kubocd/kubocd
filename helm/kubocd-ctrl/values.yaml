# Following will allow a renaming of all kubocd kubernetes resources
# Allow overriding base name of all resources
baseNameOverride:

# Image is same for controller and webhook
image:
  pullSecrets: []
  # -- Override the image repository. Default is .Chart.Annotations.kubotal_image_repository (See Chart.yaml)
  repository:
  # -- Overrides the image tag whose default is the chart appVersion.
  tag:
  pullPolicy: IfNotPresent


contexts: []
#  - name: # TBD
#    namespace: # Default to .Release.namespace
#    description: #TBD
#    parents: []
#    context: {}

config:
  enabled: true
  content:
    packageRedirects: []
  #    - oldPrefix: # TBD
  #      newPrefix: # TBD
  #      certSecretRef:
  #        name: # TBD
  #     # Other OciRepositorySpec elements
    clusterRoles: []
  #    - storage
    defaultContexts: []
  #    - name: cluster
  #      namespace: contexts
    defaultNamespaceContexts: []
    imageRedirects: []

    specPatch: {}
    defaultPackageInterval: 30m0s
    defaultHelmTimeout: 3m0s
    defaultHelmInterval: 30m0s
    defaultOnFailureStrategy: updateOnFailure
    onFailureStrategies:
      - name: stopOnFailure
        strategy: {}
      - name: reinstallOnFailure
        strategy:
          install:
            strategy:
              name: RemediateOnFailure
            remediation:
              retries: 10
          upgrade:
            strategy:
              name: RemediateOnFailure
            remediation:
              retries: 10

      - name: updateOnFailure
        strategy:
          install:
            strategy:
              name: RetryOnFailure
              retryInterval: 1m0s
          upgrade:
            strategy:
              name: RetryOnFailure
              retryInterval: 1m0s


# for example, to store contexts
extraNamespaces: []
# - name: contexts

networkPolicies:
  enabled: true
  fluxNamespace: flux-system

controller:
  replicaCount: 2

  # Allow to change some logger configuration
  logger:
    mode: json
    level: info

  # Setup toleration and node selector to run inside control plane
  deployInControlPlane: true
  # NodeSelector for the pod to be installed (Ignored if deployInControlPlane: true)
  nodeSelector: {}
  # -- Tolerations for the pod to be installed (Ignored if deployInControlPlane: true)
  tolerations: []

  metrics:
    enabled: false
    # TLS and bearer authentication. Existing HTTP/anonymous scrapers must
    # migrate, or set secured: false for unauthenticated HTTP without a token.
    # The Service port stays named https in either mode.
    # --reuse-values keeps the old secured: false default. Set metrics.secured: true or use --reset-then-reuse-values.
    secured: true
    # The certificate Secret must contain ca.crt for server verification.
    # Empty uses the chart's self-signed issuer, otherwise name a ClusterIssuer.
    certificateClusterIssuer:
    serviceMonitor:
      enabled: false
      name:  # -- Defaults to {{ include "kubocd.controller.baseName" . }}
      # Bind the token's SA to metrics-reader. Set both fields or neither.
      # A half-filled pair fails even when disabled. Empty leaves RBAC external.
      # Some installs grant get /metrics already (e.g. kube-prometheus-stack), needing no binding.
      # Requires enabled, secured metrics, independently of serviceMonitor.enabled.
      # This creates neither the SA nor Prometheus discovery/pod configuration.
      prometheusServiceAccount:
        name: ""
        namespace: ""
      # Default: read /var/run/secrets/kubernetes.io/serviceaccount/token inside
      # Prometheus. Its identity must match the SA above or an external grant.
      # For arbitraryFSAccessThroughSMs.deny: true, use Secret-backed Bearer auth.
      # The Secret must be in the release/ServiceMonitor namespace and readable
      # by Prometheus Operator. Set both name and key or neither, even if disabled.
      # Complete credentials are used only by an enabled, secured ServiceMonitor.
      # Example in release namespace kubocd (replace with yours):
      # kubectl -n kubocd create serviceaccount kubocd-metrics-scraper
      # Apply this Secret, then wait for the control plane to fill data.token:
      # apiVersion: v1
      # kind: Secret
      # metadata:
      #   name: kubocd-metrics-scraper-token
      #   namespace: kubocd
      #   annotations:
      #     kubernetes.io/service-account.name: kubocd-metrics-scraper
      # type: kubernetes.io/service-account-token
      # Set prometheusServiceAccount: {name: kubocd-metrics-scraper, namespace: kubocd}
      # and authorization.credentials: {name: kubocd-metrics-scraper-token, key: token}.
      # This token is long-lived. Arrange rotation and revocation.
      # Keep the metrics CA, the token Secret's ca.crt is not the server CA.
      authorization:
        credentials:
          name: ""
          key: ""

    # -- Will default to {{ include "kubocd.controller.baseName" . }}-metrics
    serviceName:
    # -- Will default to {{ include "kubocd.controller.baseName" . }}-metrics
    certificateName:
    # -- Will default to {{ include "kubocd.controller.baseName" . }}-metrics
    secretName:
    # -- Will default to {{ include "kubocd.controller.baseName" . }}-metrics
    certificateSelfSignedIssuerName:


  helmRepository:
    # -- Will default to {{ include "kubocd.controller.baseName" . }}-helm-repository
    serviceName:

  resources:
    limits:
      cpu: 500m
      memory: 1024Mi
    requests:
      cpu: 100m
      memory: 512Mi

  volumeSize:
    works: 100Mi
    tmp: 100Mi

  # Security Context for container
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - "ALL"

  # -- Security Context for the whole pod
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  # -- Annotations to be added to the pod
  podAnnotations: {}

  # -- Annotations to be added to all other resources
  commonAnnotations: {}

  # -- Hooks for specific configuration. Leave as is for standard usage
  extraEnv:
  # CEL limits per condition evaluation; 0 disables that limit, negative values are refused.
  # additionalArgs: ["--conditionCelCostLimit=1000000", "--conditionCelTimeout=1s"]
  additionalArgs: []
  disableProbes: false
  extraVolumes: []
  #   - name:
  #     mountPath:
  #     claimName:


  # Following will allow a renaming of kubocd metrics related kubernetes resources
  # Allow overriding base name of all controller resources
  # -- Will default to {{ include "kubocd.baseName" . }}-controller
  baseNameOverride:
  # -- Will default to {{ include "kubocd.controller.baseName" . }}
  deploymentName:
  # -- Will default to {{ include "kubocd.controller.baseName" . }}
  serviceAccountName:
  # -- Will default to {{ include "kubocd.controller.baseName" . }}
  # Also names the Lease Role/RoleBinding: <clusterRoleName>-leader-election, in the installation namespace.
  # The ClusterRole has no Lease access; the Role grants get/create/update only.
  clusterRoleName:

  enabled: true   # Set to false for controller running outside kubernetes, for dev

  # Let the templates of every package resolve host names with the resolveDNS function, from the controller pod. The
  # result then also depends on the DNS answers. The parameters of a Release never get resolveDNS. When false, a package
  # calling it fails to render with 'resolveDNS is disabled by platform policy'.
  allowDNSLookups: false


  # WARNING: All features listed below are EXPERIMENTAL and under active development. Their resources, fields and
  # behavior may change, or be removed, in any future release without prior notice and without a migration path. Do not
  # use for production and be ready to modify any application using one of these features.
  #
  # NB: The CRDs of a gated feature are always installed, as helm does not allow conditional CRDs. So a gate only
  # controls the controller: with 'connections: false', (Cluster)Connection resources can be created, but are never
  # reconciled, and so never used by a Release.
  featureGates:
    # Activate the Contract/Connection subsystem, allowing a Release to publish and consume services.
    connections: false
    # Activate the Replication subsystem, allowing a Secret/ConfigMap to be copied in other namespaces.
    # NB: When on, the controller watches Secrets and ConfigMaps cluster wide.
    replications: false

{{ if .Values.controller.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubocd.controller.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubocd.controller.labels" . | nindent 4 }}
  {{- with .Values.controller.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubocd.controller.clusterRoleName" .}}
  labels:
    {{- include "kubocd.controller.labels" . | nindent 4 }}
  {{- with .Values.controller.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
  - apiGroups:
      - kubocd.kubotal.io
    resources:
      - releases
    verbs:
      - get
      - list
      - watch
      - update
  - apiGroups:
      - kubocd.kubotal.io
    resources:
      - contexts
      - contracts
      - clustercontracts
      - configs
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - kubocd.kubotal.io
    resources:
      - connections
      - clusterconnections
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - delete
  {{- if .Values.controller.featureGates.replications }}
  # The rules below are granted only when the 'replications' feature gate is on, as the replication
  # controller needs them. The Secret/ConfigMap one is the only rule on these kinds: it also lets the
  # conditions of a package read them.
  - apiGroups:
      - kubocd.kubotal.io
    resources:
      - replications
    verbs:
      - get
      - list
      - watch
      - update
  - apiGroups:
      - kubocd.kubotal.io
    resources:
      - replications/status
    verbs:
      - patch
  # To duplicate Secret/ConfigMap across namespaces
  - apiGroups:
      - ""
    resources:
      - secrets
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - delete
  {{- end }}
  - apiGroups:
      - kubocd.kubotal.io
    resources:
      - releases/finalizers
    verbs:
      - update
  - apiGroups:
      - kubocd.kubotal.io
    resources:
      - releases/status
      - contexts/status
    verbs:
      - update
  - apiGroups:
      - kubocd.kubotal.io
    resources:
      - connections/status
      - clusterconnections/status
      - contracts/status
      - clustercontracts/status
    verbs:
      - patch
  - apiGroups:
      - source.toolkit.fluxcd.io
    resources:
      - ocirepositories
    verbs:
      - get
      - list
      - watch
      - create
      - patch
  - apiGroups:
      - source.toolkit.fluxcd.io
    resources:
      - helmrepositories
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - delete
  - apiGroups:
      - helm.toolkit.fluxcd.io
    resources:
      - helmreleases
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubocd.controller.clusterRoleName" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubocd.controller.labels" . | nindent 4 }}
  {{- with .Values.controller.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - create
      - update

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubocd.controller.clusterRoleName" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubocd.controller.labels" . | nindent 4 }}
  {{- with .Values.controller.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubocd.controller.clusterRoleName" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "kubocd.controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubocd.controller.serviceAccountName" . }}-{{ include "kubocd.controller.clusterRoleName" .}}-binding
  labels:
    {{- include "kubocd.controller.labels" . | nindent 4 }}
  {{- with .Values.controller.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubocd.controller.clusterRoleName" .}}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubocd.controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}

{{ if and .Values.controller.metrics.enabled .Values.controller.metrics.secured }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubocd.controller.clusterRoleName" .}}-metrics-auth
  labels:
    {{- include "kubocd.controller.labels" . | nindent 4 }}
  {{- with .Values.controller.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
  - apiGroups:
      - authorization.k8s.io
    resources:
      - subjectaccessreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubocd.controller.serviceAccountName" . }}-{{ include "kubocd.controller.clusterRoleName" .}}-metrics-auth
  labels:
    {{- include "kubocd.controller.labels" . | nindent 4 }}
  {{- with .Values.controller.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubocd.controller.clusterRoleName" .}}-metrics-auth
subjects:
  - kind: ServiceAccount
    name: {{ include "kubocd.controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubocd.controller.clusterRoleName" .}}-metrics-reader
rules:
  - nonResourceURLs:
      - /metrics
    verbs:
      - get
{{ end }}

{{ end }}


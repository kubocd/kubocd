---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - kubocd.kubotal.io
  resources:
  - clusterconnections
  - configs
  - connections
  - contexts
  - interfaces
  - releases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kubocd.kubotal.io
  resources:
  - clusterconnections/finalizers
  - configs/finalizers
  - connections/finalizers
  - contexts/finalizers
  - interfaces/finalizers
  - releases/finalizers
  verbs:
  - update
- apiGroups:
  - kubocd.kubotal.io
  resources:
  - clusterconnections/status
  - configs/status
  - connections/status
  - contexts/status
  - interfaces/status
  - releases/status
  verbs:
  - get
  - patch
  - update

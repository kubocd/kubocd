  - contracts
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - kubocd.kubotal.io
  resources:
  - contexts/status
  - releases/finalizers
  - releases/status
  verbs:
  - update
- apiGroups:
  - kubocd.kubotal.io
  resources:
  - releases
  - replications
  verbs:
  - get
  - list
  - update
  - watch
- apiGroups:
  - source.toolkit.fluxcd.io
  resources:
  - helmrepositories
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - watch
- apiGroups:
  - source.toolkit.fluxcd.io
  resources:
  - ocirepositories
  verbs:
  - create
  - get
  - list
  - patch
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: leader-election-role
  namespace: kubocd

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: claims.kubocd.kubotal.io
spec:
  group: kubocd.kubotal.io
  names:
    kind: Claim
    listKind: ClaimList
    plural: claims
    shortNames:
    - clm
    singular: claim
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.contract
      name: Contract
      type: string
    - jsonPath: .spec.target.provisioner
      name: Provisioner
      type: string
    - jsonPath: .spec.target.connection
      name: Connection
      type: string
    - jsonPath: .status.phase
      name: Status
      type: string
    - jsonPath: .status.connection
      name: Bound
      type: string
    - jsonPath: .status.message
      name: Message
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Claim requests a connection of a contract, from a provisioner
          or from an existing Connection.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              contract:
                description: The contract of the connection
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: contract is immutable
                  rule: self == oldSelf
              requirements:
                description: Checked against the connection, as the claim section
                  of the contract defines
                type: object
                x-kubernetes-preserve-unknown-fields: true
              target:
                description: 'ClaimTarget names what binds the claim: a provisioner
                  or an existing Connection.'
                properties:
                  connection:
                    description: An existing Connection, in the namespace of the claim
                    minLength: 1
                    type: string
                  provisioner:
                    description: A provisioner, which creates the resource and the
                      connection, then writes the status of the claim
                    minLength: 1
                    type: string
                type: object
                x-kubernetes-validations:
                - message: target is immutable
                  rule: self == oldSelf
                - message: exactly one of provisioner and connection must be set
                  rule: has(self.provisioner) != has(self.connection)
            required:
            - contract
            - target
            type: object
          status:
            description: |-
              ClaimStatus is written by KuboCD when the target is a connection, and by the provisioner otherwise.
              All its fields are optional, for the provisioner to write the first status.
            properties:
              connection:
                description: The bound Connection, in the namespace of the claim
                type: string
              message:
                description: The reason, when UNBOUND
                type: string
              observedGeneration:
                description: The generation of the claim this status was written for
                format: int64
                type: integer
              phase:
                enum:
                - BOUND
                - UNBOUND
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
